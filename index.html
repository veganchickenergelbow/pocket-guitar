<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="description" content="Pocket: a guitar and harmony coach that fits in your pocket.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket">
<meta name="theme-color" content="#111319" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f6" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="statusbar" aria-hidden="true"></div>
<main id="view" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="Main">
  <button class="tab" data-route="today" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Today
  </button>
  <button class="tab" data-route="learn" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 4v16M20 4v16M3 8h18M3 14h18"/></svg>Learn
  </button>
  <button class="tab" data-route="ear" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2l2-6 3 12 3-9 2 5 2-2h4"/></svg>Ear
  </button>
  <button class="tab" data-route="tools" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7h8M7 21l5-6 5 6"/></svg>Tools
  </button>
</nav>
<noscript><p style="padding:24px;font-family:system-ui">Pocket needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
