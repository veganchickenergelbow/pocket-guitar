<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#111319"/>
  <!-- strings: thicker toward the low side -->
  <g stroke="#9aa0ae" stroke-linecap="round" opacity=".85">
    <line x1="160" y1="128" x2="160" y2="384" stroke-width="7"/>
    <line x1="198" y1="128" x2="198" y2="384" stroke-width="6"/>
    <line x1="237" y1="128" x2="237" y2="384" stroke-width="5"/>
    <line x1="275" y1="128" x2="275" y2="384" stroke-width="4"/>
    <line x1="314" y1="128" x2="314" y2="384" stroke-width="3"/>
    <line x1="352" y1="128" x2="352" y2="384" stroke-width="2.5"/>
  </g>
  <!-- nut and fret wire -->
  <rect x="148" y="140" width="216" height="12" rx="3" fill="#ecebe6"/>
  <g stroke="#2e3342" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="248" x2="362" y2="248"/>
    <line x1="150" y1="344" x2="362" y2="344"/>
  </g>
  <!-- brass dot -->
  <circle cx="275" cy="296" r="26" fill="#e2b45e"/>
</svg>
